[workspace]
members = [
  "apps/ferro-linux",
  "apps/ferro-macos",
  "apps/ferro-windows",
  "crates/ferro-application",
  "crates/ferro-contracts",
  "crates/ferro-design",
  "crates/ferro-domain",
  "crates/ferro-macos-runtime",
  "crates/ferro-project",
  "crates/ferro-sdk",
  "crates/ferro-services",
  "crates/ferro-state",
  "crates/ferro-storage",
  "crates/ferro-testkit",
  "tools/ferro-cli",
  "tools/xtask",
]
default-members = [
  "apps/ferro-macos",
  "crates/ferro-application",
  "crates/ferro-contracts",
  "crates/ferro-design",
  "crates/ferro-domain",
  "crates/ferro-macos-runtime",
  "crates/ferro-project",
  "crates/ferro-sdk",
  "crates/ferro-services",
  "crates/ferro-state",
  "tools/ferro-cli",
]
resolver = "3"
exclude = ["examples/project-notebook"]

[workspace.package]
edition = "2024"
rust-version = "1.100"
license = "MIT OR Apache-2.0"
repository = "https://github.com/shaynn/ferro"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

