[workspace]
members = ["crates/project-notebook-core", "apps/project-notebook-macos"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.100"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
