[package]
name = "ferro"
description = "Terminal-first developer tools for Ferro."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "ferro"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.54", features = ["derive"] }
ferro-contracts = { path = "../../crates/ferro-contracts" }
ferro-project = { path = "../../crates/ferro-project" }
ferro-sdk = { path = "../../crates/ferro-sdk" }
ferro-storage = { path = "../../crates/ferro-storage" }

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true

