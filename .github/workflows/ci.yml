name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
        if: runner.os == 'macOS'
      - run: cargo test --workspace
        if: runner.os == 'macOS'
      - name: Verify generated macOS bundle
        if: runner.os == 'macOS'
        run: |
          project="$RUNNER_TEMP/ferro-cli-bundle"
          cargo run -p ferro -- init "$project"
          cargo run -p ferro -- build macos --project "$project"
          plutil -lint "$project/target/ferro/macos/debug/ferro-cli-bundle.app/Contents/Info.plist"
          test -f "$project/target/ferro/macos/debug/ferro-cli-bundle.app/Contents/MacOS/ferro-cli-bundle-macos"
      - run: cargo clippy --workspace --exclude ferro-macos --exclude ferro-macos-runtime --all-targets -- -D warnings
        if: runner.os != 'macOS'
      - run: cargo test --workspace --exclude ferro-macos --exclude ferro-macos-runtime
        if: runner.os != 'macOS'
